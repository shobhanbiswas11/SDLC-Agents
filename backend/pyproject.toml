[project]
name = "coding-standards-enforcer-backend"
version = "0.2.0"
description = "Backend service for the GENAICOE Coding Standards Enforcer agent."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    # Core server
    "fastapi>=0.126.0",
    "uvicorn>=0.38.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",

    # Azure + LLM
    "azure-identity>=1.20.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",

    # HTTP client
    "requests>=2.31.0",

    # Python linters & formatters
    "black>=25.1.0",
    "flake8>=7.3.0",
    "isort>=6.0.0",
    "autopep8>=2.3.0",
    "autoflake>=2.3.0",
]
