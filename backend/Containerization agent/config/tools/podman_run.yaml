# Podman / Docker Run Tool
# Runs a previously built container image.

name: podman_run
description: Run a previously built container image.

parameters:
  type: object
  properties:
    image_name:
      type: string
      description: Image name to run.
    ports:
      type: string
      description: "Port mapping, e.g. '8080:8080'."
    detach:
      type: boolean
      description: Run in the background (default true).
  required:
    - image_name

activity:
  name: podman_run_activity
  timeout_seconds: 60
  retry_policy:
    max_attempts: 2
    initial_interval_seconds: 2
