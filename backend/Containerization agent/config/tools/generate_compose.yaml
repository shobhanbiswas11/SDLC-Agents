# Generate Compose Tool
# Generates a docker-compose.yml from the project analysis.

name: generate_compose
description: Generate a docker-compose.yml and write it to the workspace.

parameters:
  type: object
  properties:
    analysis:
      type: string
      description: JSON string returned by analyze_project.
  required:
    - analysis

activity:
  name: generate_compose_activity
  timeout_seconds: 90
  retry_policy:
    max_attempts: 3
    initial_interval_seconds: 2
