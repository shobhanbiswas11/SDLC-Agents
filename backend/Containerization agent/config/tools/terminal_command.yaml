# Terminal Command Tool
# Runs an arbitrary shell command inside the workspace directory.

name: terminal_command
description: Run an arbitrary shell command inside the workspace directory.

parameters:
  type: object
  properties:
    command:
      type: string
      description: Shell command to execute.
    explanation:
      type: string
      description: Human-readable reason for running this command.
  required:
    - command

activity:
  name: terminal_command_activity
  timeout_seconds: 120
  retry_policy:
    max_attempts: 1
    initial_interval_seconds: 1
