# Podman / Docker Stop Tool
# Stops and removes a running container.

name: podman_stop
description: Stop and remove a running container.

parameters:
  type: object
  properties:
    container_id:
      type: string
      description: Container ID or name to stop.
  required:
    - container_id

activity:
  name: podman_stop_activity
  timeout_seconds: 30
  retry_policy:
    max_attempts: 2
    initial_interval_seconds: 1
