# Ask User Tool
# Pauses execution to ask the user a clarifying question.

name: ask_user
description: Pause execution and ask the user a question when you are blocked or need clarification.

parameters:
  type: object
  properties:
    question:
      type: string
      description: The question to ask the user.
  required:
    - question

activity:
  name: ask_user_activity
  timeout_seconds: 300
  retry_policy:
    max_attempts: 1
    initial_interval_seconds: 1
