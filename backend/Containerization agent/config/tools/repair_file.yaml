# Repair File Tool
# Uses AI to fix a source file based on a build or runtime error log.

name: repair_file
description: Use AI to fix a source file based on a build or runtime error log.

parameters:
  type: object
  properties:
    file_path:
      type: string
      description: Path of the file to repair.
    error_log:
      type: string
      description: The error output from the failed build or run.
  required:
    - file_path
    - error_log

activity:
  name: repair_file_activity
  timeout_seconds: 90
  retry_policy:
    max_attempts: 3
    initial_interval_seconds: 2
