# Read File Tool
# Reads the full text content of a file inside the workspace.

name: read_file
description: Read the full text content of a file inside the workspace.

parameters:
  type: object
  properties:
    file_path:
      type: string
      description: Path to the file (relative to workspace or absolute).
  required:
    - file_path

activity:
  name: read_file_activity
  timeout_seconds: 30
  retry_policy:
    max_attempts: 3
    initial_interval_seconds: 1
