# Write File Tool
# Write or overwrite a file inside the workspace.

name: write_file
description: Write or overwrite a file inside the workspace.

parameters:
  type: object
  properties:
    file_path:
      type: string
      description: Destination path (relative to workspace or absolute).
    content:
      type: string
      description: Full file content to write.
  required:
    - file_path
    - content

activity:
  name: write_file_activity
  timeout_seconds: 30
  retry_policy:
    max_attempts: 3
    initial_interval_seconds: 1
