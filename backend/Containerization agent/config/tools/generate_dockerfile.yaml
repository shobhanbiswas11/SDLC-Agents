# Generate Dockerfile Tool
# Generates a production-ready Dockerfile and .dockerignore from the project analysis.

name: generate_dockerfile
description: Generate a production-ready Dockerfile and .dockerignore and write them to the workspace.

parameters:
  type: object
  properties:
    analysis:
      type: string
      description: JSON string returned by analyze_project.
  required:
    - analysis

activity:
  name: generate_dockerfile_activity
  timeout_seconds: 90
  retry_policy:
    max_attempts: 3
    initial_interval_seconds: 2
