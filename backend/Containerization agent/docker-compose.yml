version: '3.8'

services:
  web:
    image: python:3.9-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: flask run --host=0.0.0.0 --port=5000
    environment:
      - FLASK_APP=sample-flask-app/app.py
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    depends_on: []
    restart: always