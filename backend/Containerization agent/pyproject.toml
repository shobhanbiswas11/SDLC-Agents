[project]
name = "docker-ai-agent"
version = "1.0.0"
description = "AI-powered containerisation agent — generates, builds, repairs, and optimises Docker/Podman images for any project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30",
    "azure-identity>=1.16",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tiktoken>=0.6",
]

[project.scripts]
docker-agent = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
