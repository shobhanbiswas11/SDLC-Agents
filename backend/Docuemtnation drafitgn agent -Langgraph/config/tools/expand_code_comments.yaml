name: expand_code_comments
description: Read a source file and automatically expand and improve inline code comments to make it highly readable and properly documented.

parameters:
  type: object
  properties:
    file_path:
      type: string
      description: The path to the source file to comment.
  required:
    - file_path

activity:
  name: expand_code_comments_activity
  timeout_seconds: 45
  retry_policy:
    max_attempts: 2
    initial_interval_seconds: 1
