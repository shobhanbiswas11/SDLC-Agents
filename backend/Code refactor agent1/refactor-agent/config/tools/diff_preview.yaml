# Diff Preview Tool
# Shows a unified diff between original and refactored code

name: diff_preview
description: Generate a unified diff showing the differences between the original code and the proposed refactored version. After calling suggest_refactor, simply pass new_content as "staged" to use the staged refactored code.

parameters:
  type: object
  properties:
    file_path:
      type: string
      description: Path to the original file
    new_content:
      type: string
      description: Use "staged" to diff against the refactored code from suggest_refactor. Defaults to "staged".
      default: "staged"
  required:
    - file_path
