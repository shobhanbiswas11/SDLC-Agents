# Run Tests Tool
# Runs the project test suite to verify refactors didn't break anything

name: run_tests
description: Run tests relevant to the refactored file. Prefer file-specific tests (for example tests/test_<stem>.py or <source_dir>/test_<stem>.py). If no dedicated test exists, report that clearly and perform only a syntax check for the source file.

parameters:
  type: object
  properties:
    test_command:
      type: string
      description: The command to run tests (e.g., "pytest", "npm test", "python -m unittest"). Defaults to "pytest" if not specified.
    test_path:
      type: string
      description: Optional path to a specific test file or directory to run.
    source_file:
      type: string
      description: Path to the refactored source file. Used to discover matching tests such as tests/test_<stem>.py.
  required: []
