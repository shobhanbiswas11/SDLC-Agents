# Apply Refactor Tool
# Writes the refactored code back to the file

name: apply_refactor
description: Apply a previously suggested refactor by writing the staged code to the file. Only call this AFTER the user has approved the changes via ask_user. Uses the staged code from suggest_refactor automatically.

parameters:
  type: object
  properties:
    file_path:
      type: string
      description: Path to the file to update
    new_content:
      type: string
      description: Use "staged" to apply the refactored code from suggest_refactor. Defaults to "staged".
      default: "staged"
  required:
    - file_path
