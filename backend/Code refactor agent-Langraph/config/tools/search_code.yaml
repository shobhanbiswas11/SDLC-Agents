name: search_code
description: >
  Search for text or regex patterns across files in the workspace.
  Returns matching lines with file paths and line numbers.
  Useful for finding usages of functions, variables, imports, or any text pattern across the codebase.
parameters:
  type: object
  properties:
    query:
      type: string
      description: "The text or regex pattern to search for."
    file_pattern:
      type: string
      description: "Glob pattern to filter files (e.g. '*.py', '*.js'). Default: all files."
      default: "*"
    is_regex:
      type: boolean
      description: "If true, treat query as a regex pattern. Default: false."
      default: false
    max_results:
      type: integer
      description: "Maximum number of matching lines to return. Default: 50."
      default: 50
  required:
    - query
