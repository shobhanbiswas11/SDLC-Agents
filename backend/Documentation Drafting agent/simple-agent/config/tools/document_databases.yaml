name: document_databases
description: Read database schemas (like .sql, Prisma, or TypeORM files) and generate a rigorous data dictionary and schema documentation.

parameters:
  type: object
  properties:
    schema_file_path:
      type: string
      description: Path to the schema file (.sql, schema.prisma, etc.).
  required:
    - schema_file_path

activity:
  name: document_databases_activity
  timeout_seconds: 45
  retry_policy:
    max_attempts: 2
    initial_interval_seconds: 1
