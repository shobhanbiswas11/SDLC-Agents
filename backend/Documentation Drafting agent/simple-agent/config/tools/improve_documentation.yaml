name: improve_documentation
description: Takes an existing markdown file and rewrites it to improve structure, clarity, grammar, and overall professionalism. Returns improved markdown.

parameters:
  type: object
  properties:
    file_path:
      type: string
      description: The path to the current markdown file (.md).
  required:
    - file_path

activity:
  name: improve_documentation_activity
  timeout_seconds: 60
  retry_policy:
    max_attempts: 2
    initial_interval_seconds: 1
