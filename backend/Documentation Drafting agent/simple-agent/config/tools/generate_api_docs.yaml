name: generate_api_docs
description: Analyze a specific file or folder and document its API endpoints, functions, or classes. Returns the generated markdown.

parameters:
  type: object
  properties:
    target_path:
      type: string
      description: The path to the source file or directory containing the API source code.
  required:
    - target_path

activity:
  name: generate_api_docs_activity
  timeout_seconds: 60
  retry_policy:
    max_attempts: 2
    initial_interval_seconds: 1
