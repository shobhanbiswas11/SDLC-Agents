services:
  temporal-postgres:
    image: postgres:13
    container_name: doc-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - doc-temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: doc-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "${TEMPORAL_HOST_PORT:-8233}:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    restart: unless-stopped

  doc-first-ai-api:
    build:
      context: ../..
      dockerfile: "infra/Documentation Drafting agent/Dockerfile.first-ai"
    container_name: doc-first-ai-api
    environment:
      PORT: 8000
      YOUR_GITHUB_ACCESS_TOKEN: ${YOUR_GITHUB_ACCESS_TOKEN:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-01-01-preview}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_CHATGPT_DEPLOYMENT: ${AZURE_OPENAI_CHATGPT_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
    ports:
      - "${DOC_FIRST_API_HOST_PORT:-18100}:8000"
    restart: unless-stopped

  doc-simple-api:
    build:
      context: ../..
      dockerfile: "infra/Documentation Drafting agent/Dockerfile.simple-api"
    container_name: doc-simple-api
    environment:
      PORT: 8001
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-01-01-preview}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_CHATGPT_DEPLOYMENT: ${AZURE_OPENAI_CHATGPT_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
    ports:
      - "${DOC_SIMPLE_API_HOST_PORT:-18101}:8001"
    depends_on:
      - temporal
    restart: unless-stopped

  doc-simple-worker:
    build:
      context: ../..
      dockerfile: "infra/Documentation Drafting agent/Dockerfile.simple-worker"
    container_name: doc-simple-worker
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-01-01-preview}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_CHATGPT_DEPLOYMENT: ${AZURE_OPENAI_CHATGPT_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
    depends_on:
      - temporal
    restart: unless-stopped

  doc-ui:
    build:
      context: ../..
      dockerfile: "infra/Documentation Drafting agent/Dockerfile.ui"
    container_name: doc-ui
    environment:
      NEXT_PUBLIC_DOC_FIRST_API_BASE_URL: http://localhost:${DOC_FIRST_API_HOST_PORT:-18100}
      NEXT_PUBLIC_DOC_SIMPLE_API_BASE_URL: http://localhost:${DOC_SIMPLE_API_HOST_PORT:-18101}
    ports:
      - "${DOC_UI_HOST_PORT:-13100}:3000"
    depends_on:
      - doc-first-ai-api
      - doc-simple-api
    restart: unless-stopped

volumes:
  doc-temporal-postgres-data:
