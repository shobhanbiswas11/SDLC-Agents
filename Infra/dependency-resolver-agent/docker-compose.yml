services:
  backend:
    build:
      context: ../..
      dockerfile: Infra/dependency-resolver-agent/Dockerfile.backend
    env_file:
      - ../../backend/dependency-resolver-agent/.env
    ports:
      - "8001:8001"
    volumes:
      - /tmp/dependency-resolver-repos:/tmp/dependency-resolver-repos
      - /tmp/dependency-resolver-cache:/tmp/dependency-resolver-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: Infra/dependency-resolver-agent/Dockerfile.frontend
      args:
        VITE_API_BASE: http://localhost:8001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:5174"
    restart: unless-stopped