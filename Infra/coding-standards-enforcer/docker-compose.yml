version: "3.9"

services:
  backend:
    container_name: coding-standards-backend
    build:
      context: ../../
      dockerfile: Infra/coding-standards-enforcer/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ../../backend/.env

  frontend:
    container_name: coding-standards-frontend
    build:
      context: ../../
      dockerfile: Infra/coding-standards-enforcer/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
