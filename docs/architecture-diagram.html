<script>
const DETAILS = {
  user: {
    title: 'User (Browser)',
    desc: 'End user interacts through the Next.js frontend. Creates sessions, pastes manifests, chats with the resolver, and approves/rejects lockfiles.',
    file: ''
  },
  redux: {
    title: 'Redux Store',
    desc: 'Central state management via Redux Toolkit. Tracks session ID, connection status, chat entries, streaming state, pending approvals, and final lockfile/report.',
    file: 'frontend/src/store/slices/dependencyResolverSlice.ts'
  },
  'ws-client': {
    title: 'WebSocket Client',
    desc: 'Native WebSocket with auto-reconnect and exponential backoff (1s → 30s, max 5 attempts). Handles real-time HITL communication: solver events, agent messages, and approval requests.',
    file: 'frontend/src/services/dependencyResolverService.ts'
  },
  axios: {
    title: 'Axios HTTP Client',
    desc: 'REST client for session CRUD operations: create session (POST), get session state (GET), delete session (DELETE), and REST approval fallback.',
    file: 'frontend/src/services/api.ts'
  },
  router: {
    title: 'FastAPI Router',
    desc: 'Defines all REST and WebSocket endpoints under /api/dependency_resolver. Routes: /session, /session/{id}, /resolve, /diff, /audit, /health, /chat/{id} (WS).',
    file: 'agents/dependency_resolver/__init__.py'
  },
  guardrails: {
    title: 'Guardrails Layer',
    desc: 'Input validation: blocks malicious content, enforces max payload sizes. Output validation: ensures generated lockfiles and reports are safe before delivery.',
    file: 'agents/dependency_resolver/hitl/guardrails.py'
  },
  orchestrator: {

const tooltip = document.getElementById('tooltip');
const tipTitle = document.getElementById('tip-title');
const tipDesc = document.getElementById('tip-desc');
const tipFile = document.getElementById('tip-file');

document.querySelectorAll('.component').forEach(g => {
  const key = g.dataset.component;
  if (!DETAILS[key]) return;

  g.addEventListener('mouseenter', (e) => {
    const d = DETAILS[key];
    tipTitle.textContent = d.title;
    tipDesc.textContent = d.desc;
    tipFile.innerHTML = d.file ? '<span class="tip-file">' + d.file + '</span>' : '';
    tooltip.classList.add('visible');
  });

  g.addEventListener('mousemove', (e) => {
    const x = e.clientX + 16;
    const y = e.clientY + 12;
    const tw = tooltip.offsetWidth;
    const th = tooltip.offsetHeight;
    tooltip.style.left = (x + tw > window.innerWidth ? e.clientX - tw - 8 : x) + 'px';
    tooltip.style.top = (y + th > window.innerHeight ? e.clientY - th - 8 : y) + 'px';
  });

  g.addEventListener('mouseleave', () => {
    tooltip.classList.remove('visible');
  });
});
</script>

</html>
