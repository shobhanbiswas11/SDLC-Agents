<div id="tooltip"><h4 id="tt-title"></h4><p id="tt-body"></p><span id="tt-code" class="mono"></span></div>

<script>
const TIPS = {
  parse:       {t:"Stage 1 · Parse Manifest",         b:"Dispatches to ecosystem parser. Returns List[Tuple[name, constraint]]. Raises ValueError on malformed input.",  c:"parsers/requirements_txt.py · parsers/package_json.py"},
  dag:         {t:"Stage 2 · Build Dependency Graph",  b:"Recursive BFS expands transitive deps up to max_depth=4. Each node fetched via registry client (concurrent, no Semaphore). Caches visited nodes to prevent infinite loops.", c:"resolver/graph.py · DependencyGraph.build()"},
  solve:       {t:"Stage 3 · PubGrub Solver",          b:"Collects all constraints per package across the DAG, then selects one version satisfying all. Strategy: stable=latest non-prerelease, latest=abs latest, minimal=oldest.", c:"resolver/solver.py · PubGrubSolver.solve()"},
  cve:         {t:"Stage 4 · CVE Audit",               b:"Concurrent HTTP POST to api.osv.dev/v1/query — up to 10 at once (Semaphore). Each package gets vulnerabilities[] field added. No API key required.", c:"security/osv_client.py · OSVClient.annotate_packages()"},
  license:     {t:"Stage 5 · License Check",           b:"Synchronous check. Validates license compatibility matrix across all resolved packages. Results bundled into report_markdown.", c:"security/license_check.py · LicenseChecker.check()"},
  llm:         {t:"Stage 6 · LLM Explain (Streaming)", b:"Azure OpenAI streaming explanation of conflicts. Uses async generator — each token emitted as agent_message{delta, done:false}. Falls back to deterministic explanation if Azure unavailable.", c:"llm/explainer.py · DependencyExplainer.stream_explanation()"},
  output:      {t:"Stage 7 · Build Output",            b:"build_lockfile() formats per ecosystem: pypi=name==ver, npm=package.json format, cargo=Cargo.lock style. build_report() generates full markdown with stats, CVEs, and lockfile block.", c:"llm/explainer.py · build_lockfile() · build_report()"},
  guardrails:  {t:"Stage 8 · Output Guardrails",       b:"L1: checks for hallucinated versions (versions not in resolved[]) · L2: CVE citations must match CVE-/GHSA- pattern · L3: softens overconfident language. Raises GuardrailViolation.", c:"hitl/guardrails.py · GuardrailLayer.check_output()"},
  approval:    {t:"Stage 9 · Approval Gate",           b:"Stores ResolveResponse in _FINAL dict (not released yet). Registers ApprovalRequest in _PENDING. Emits approval_request WS frame. Session transitions to PENDING_APPROVAL.", c:"hitl/approval_gateway.py · store_result() · register()"},
  "s-created": {t:"State: CREATED",                   b:"Session object created, UUID assigned, JSON written to disk. No WS connection yet. Pipeline has not started.", c:"hitl/session.py · create_session()"},
  "s-active":  {t:"State: ACTIVE",                    b:"WS connected. Can run pipeline, answer questions, run searches. asyncio.Lock prevents concurrent pipeline runs within same session.", c:"hitl/orchestrator.py · connect()"},
  "s-pending": {t:"State: PENDING_APPROVAL",          b:"Pipeline completed. Lockfile stored but NOT released. Awaiting APPROVE or REJECT from user. No new pipeline runs allowed.", c:"hitl/approval_gateway.py · register()"},
  "s-approved":{t:"State: APPROVED",                  b:"User clicked Approve. _FINAL[sid] popped and returned. Lockfile downloadable. User can start a new pipeline run.", c:"hitl/approval_gateway.py · decide()"},
  "s-rejected":{t:"State: REJECTED",                  b:"User clicked Reject. _FINAL[sid] discarded. Lockfile withheld. pending_approval cleared. User can re-run or ask questions.", c:"hitl/approval_gateway.py · decide()"},
  "s-closed":  {t:"State: CLOSED",                    b:"Session terminated via DELETE /session/{id} or WS drop. No further operations possible. Session data remains on disk for audit.", c:"hitl/__init__.py · DELETE /session/{id}"},
  "api-client":{t:"apiClient (Axios)",                b:"Singleton Axios instance. Injects Authorization header from localStorage token. Redirects to /login on 401. Used by createSession, getSession, deleteSession.", c:"services/api.ts · ApiClient"},
  "dr-service":{t:"dependencyResolverService",        b:"Main service module. Manages WebSocket lifecycle including reconnect (exponential backoff). sendApproval() falls back to REST POST if WS is closed.", c:"services/dependencyResolverService.ts"},
  "ws-instance":{t:"WebSocket Instance",              b:"Native browser WebSocket. onmessage parses JSON and dispatches frameReceived(). onclose triggers reconnect unless _intentionalClose=true.", c:"services/dependencyResolverService.ts · connectWS()"},
  "redux-state":{t:"HITLSessionState (Redux)",        b:"Central state for the resolver UI. entries[] holds the full conversation. pendingApproval drives the InlineApproval component visibility.", c:"store/slices/dependencyResolverSlice.ts"},
  "redux-actions":{t:"Redux Action Creators",         b:"frameReceived() is the core reducer — routes to type-specific handlers for each MessageType. agent_message supports streaming by appending deltas to last entry.", c:"store/slices/dependencyResolverSlice.ts · frameReceived"},
  page:        {t:"DependencyResolverPage",           b:"Client component. Manages local state (input, strategy, storedSessions). detectEcosystem() uses regex to auto-detect from pasted text. handleDownload() creates blob with ecosystem-specific filename.", c:"app/dependency-resolver/page.tsx"},
  "schema-session":{t:"HITLSession (Pydantic)",       b:"Core session model. messages[] is the persistent conversation log. resolution_stats snapshot is written after each pipeline run.", c:"schemas.py · HITLSession"},
  "schema-chatmsg":{t:"ChatMessage",                  b:"One message in the conversation log. payload is untyped Dict to support all frame types. Only done=true frames are persisted to session.messages.", c:"schemas.py · ChatMessage"},
  "schema-approval":{t:"ApprovalRequest",             b:"Sent to client as the approval_request WS frame. Stored in approval_gateway._PENDING until user decides. Contains full lockfile for preview.", c:"schemas.py · ApprovalRequest"},
  "schema-wsmsg":{t:"WSMessage",                      b:"Wire format for all WebSocket frames. Payload varies by MessageType. Max 64KB enforced at multiple levels.", c:"schemas.py · WSMessage"},
  "schema-response":{t:"ResolveResponse",             b:"The output of the resolution pipeline. Stored in approval_gateway._FINAL until APPROVE. Also returned directly by headless /resolve endpoint.", c:"schemas.py · ResolveResponse"},
  "schema-pkg":{t:"ResolvedPackage",                  b:"One resolved package in the dependency tree. vulnerabilities[] populated by OSVClient. parents[] enables tracing the dependency chain.", c:"schemas.py · ResolvedPackage"},
  "schema-conflict":{t:"Conflict",                    b:"Represents a version conflict. requested_by maps each dependent to its constraint. resolution is the chosen version (may not satisfy all).", c:"schemas.py · Conflict"},
  "schema-node":{t:"DependencyNode (DAG)",            b:"In-memory node in the dependency graph. Uses __slots__ for efficiency. parents/children store package names (not refs) to avoid circular references.", c:"resolver/graph.py · DependencyNode"},
  "ts-state":  {t:"HITLSessionState (TypeScript)",    b:"Redux slice state. Mirrors the backend session shape. entries[] drives the chat UI. finalLockfile triggers the download button appearance.", c:"types/dependencyResolver.ts"},
  "ts-chatentry":{t:"ChatEntry",                      b:"Union-like type with optional fields per message type. approval? field carries the full approval payload for the InlineApproval component.", c:"types/dependencyResolver.ts · ChatEntry"},
  "ts-wsframe":{t:"WSFrame (TypeScript)",              b:"Parsed directly from ws.onmessage event data. Dispatched via frameReceived() to the Redux slice reducer.", c:"types/dependencyResolver.ts · WSFrame"},
  "ts-approval":{t:"ApprovalRequestPayload",          b:"Embedded in ChatEntry.approval. Drives the InlineApproval component UI — shows lockfile stats, conflict list, and APPROVE/REJECT buttons.", c:"types/dependencyResolver.ts · ApprovalRequestPayload"}
};

const tooltip = document.getElementById('tooltip');
const ttTitle = document.getElementById('tt-title');
const ttBody = document.getElementById('tt-body');
const ttCode = document.getElementById('tt-code');

document.querySelectorAll('[data-tip]').forEach(el => {
  el.addEventListener('mouseenter', e => {
    const d = TIPS[el.dataset.tip];
    if (!d) return;
    ttTitle.textContent = d.t;
    ttBody.textContent = d.b;
    ttCode.textContent = d.c || '';
    ttCode.style.display = d.c ? 'block' : 'none';
    tooltip.classList.add('vis');
  });
  el.addEventListener('mousemove', e => {
    const x = e.clientX + 14, y = e.clientY + 14;
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    tooltip.style.left = (x + tw > window.innerWidth  ? e.clientX - tw - 8 : x) + 'px';
    tooltip.style.top  = (y + th > window.innerHeight ? e.clientY - th - 8 : y) + 'px';
  });
  el.addEventListener('mouseleave', () => tooltip.classList.remove('vis'));
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const n = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('p' + n).classList.add('active');
  });
});
</script>
